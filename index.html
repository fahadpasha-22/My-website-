
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahad Pasha | Portfolio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 28px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            margin-top: 30px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #06b6d4, #9333ea);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <h1>Fahad Pasha</h1>
    <p>Full Stack Developer</p>

    <div class="container">

        <h2>Contact Me</h2>

        <form action="https://formspree.io/f/mqegzzpg" method="POST">

            <input type="text" name="name" placeholder="Your Name" required>

            <input type="email" name="email" placeholder="Email Address" required>

            <input type="text" name="subject" placeholder="Subject">

            <textarea name="message" placeholder="Your Message"></textarea>

            <button type="submit">Send Message</button>

        </form>

    </div>

</body>
</html>
